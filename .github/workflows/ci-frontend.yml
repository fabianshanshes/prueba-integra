name: CI - Frontend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/web/**'

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint con oxlint
        run: npm run lint

      - name: Build de producción (tsc + vite build)
        run: npm run build

      - name: Verificar que dist/ se generó
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ El build no generó la carpeta dist/"
            exit 1
          fi
          echo "✅ Build exitoso, dist/ creado"