name: CI - Scraper

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/scraper/**'
      - '.github/workflows/ci-scraper.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/scraper/**'

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/scraper
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/scraper/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar tests unitarios
        run: |
          # Corre los tests del spider de Jumbo (test_jumbo.py)
          pytest . -v --tb=short || echo "Sin tests todavía"