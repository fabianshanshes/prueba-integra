name: Build & Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # permite ejecutarlo manual desde GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      # API Gateway (Go)
      # ----------------------------
      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/api
          file: ./backend/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api-gateway:latest
            ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # IA Conversacional (FastAPI)
      # ----------------------------
      - name: Build & Push IA Conversacional
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ia_conversacional
          file: ./backend/ia_conversacional/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ia-chatbot:latest
            ghcr.io/${{ github.repository }}/ia-chatbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # Scraper (Scrapy)
      # ----------------------------
      - name: Build & Push Scraper
        uses: docker/build-push-action@v5
        with:
          context: ./backend/scraper
          file: ./backend/scraper/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/scraper:latest
            ghcr.io/${{ github.repository }}/scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # Motor Rutas (OR-Tools)
      # ----------------------------
      - name: Build & Push Motor Rutas
        uses: docker/build-push-action@v5
        with:
          context: ./backend/motor_rutas
          file: ./backend/motor_rutas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/motor-rutas:latest
            ghcr.io/${{ github.repository }}/motor-rutas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # Frontend (React + Nginx)
      # ----------------------------
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          file: ./frontend/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max